<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg-mena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <radialGradient id="footer-glow-mena" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="footer-shimmer-mena" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    .font-mono-tech { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; }
    .font-display-tech { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-italic-serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  </style>

  <!-- Container -->
  <rect width="850" height="110" rx="12" fill="url(#footer-bg-mena)" stroke="#451126" stroke-width="1" />
  <circle cx="425" cy="55" r="220" fill="url(#footer-glow-mena)" />

  <!-- Shimmer Border Line -->
  <line x1="120" y1="12" x2="730" y2="12" stroke="#451126" stroke-width="1.5" />
  <line x1="120" y1="12" x2="730" y2="12" stroke="url(#footer-shimmer-mena)" stroke-width="2" stroke-linecap="round" />

  <!-- Quote -->
  <text x="425" y="48" text-anchor="middle" class="font-italic-serif" fill="#F8F0F3" font-size="14.5" letter-spacing="0.5">
    “If I could go back in time, I would fall in love with technology and choose Russia all over again.”
  </text>

  <!-- Attribution & Footnote -->
  <text x="425" y="78" text-anchor="middle" class="font-mono-tech" fill="#C77B9B" font-size="11" letter-spacing="1.5">
    MENAALLAH TAMER MOHAMMED  •  APPLIED INFORMATICS 09.03.03  •  CAIRO 🇪🇬 ➔ 🇷🇺
  </text>
  <text x="425" y="95" text-anchor="middle" class="font-display-tech" fill="#E5B5C7" font-size="9" opacity="0.6" letter-spacing="1">
    Crafted with purpose • Certified by freeCodeCamp, HP Foundation &amp; Saylor Academy
  </text>
</svg>
