<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-port" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="850" height="160" rx="14" fill="url(#bg-port)" stroke="#701A3D" stroke-width="1.8" />
  
  <!-- Corner Tech Markers -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#C77B9B" stroke-width="1.5" />
  <path d="M 836 26 L 836 14 L 824 14" fill="none" stroke="#C77B9B" stroke-width="1.5" />
  <path d="M 14 134 L 14 146 L 26 146" fill="none" stroke="#C77B9B" stroke-width="1.5" />
  <path d="M 836 134 L 836 146 L 824 146" fill="none" stroke="#C77B9B" stroke-width="1.5" />

  <!-- Top Row: Badge + Title + External Arrow -->
  <g transform="translate(30, 36)">
    <rect x="0" y="-14" width="140" height="24" rx="5" fill="#701A3D" />
    <text x="70" y="3" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="10.5" font-weight="800" letter-spacing="1">FLAGSHIP REPO</text>
  </g>
  <text x="185" y="39" class="sans" fill="#FFFFFF" font-size="17" font-weight="800">menaallah-portfolio (Menaallah — The Series)</text>
  <text x="820" y="39" text-anchor="end" class="mono" fill="#C77B9B" font-size="18" font-weight="700">↗</text>

  <!-- Description (Crystal Clear, Legible) -->
  <text x="30" y="74" class="sans" fill="#F8F0F3" font-size="13" font-weight="500">
    Cinematic, streaming-inspired personal portfolio website built with React 18, Vite 6, TypeScript, Tailwind CSS v4,
  </text>
  <text x="30" y="96" class="sans" fill="#F8F0F3" font-size="13" font-weight="500">
    Framer Motion, and Lenis Smooth Scroll. Features 4 narrative seasons, interactive certificate viewer &amp; project showcase.
  </text>

  <!-- Tech Tags (Larger, Bolder) -->
  <g transform="translate(30, 118)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="#14090F" stroke="#701A3D" stroke-width="1" />
    <text x="47" y="17" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11" font-weight="700">React 18</text>

    <rect x="105" y="0" width="85" height="26" rx="6" fill="#14090F" stroke="#701A3D" stroke-width="1" />
    <text x="147" y="17" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11" font-weight="700">Vite 6</text>

    <rect x="200" y="0" width="110" height="26" rx="6" fill="#14090F" stroke="#701A3D" stroke-width="1" />
    <text x="255" y="17" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11" font-weight="700">TypeScript</text>

    <rect x="320" y="0" width="110" height="26" rx="6" fill="#14090F" stroke="#701A3D" stroke-width="1" />
    <text x="375" y="17" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11" font-weight="700">Tailwind v4</text>

    <rect x="440" y="0" width="130" height="26" rx="6" fill="#14090F" stroke="#701A3D" stroke-width="1" />
    <text x="505" y="17" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11" font-weight="700">Framer Motion</text>
  </g>
</svg>