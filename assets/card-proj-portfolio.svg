  </g>
  <text x="165" y="36" class="sans" fill="#F8F0F3" font-size="16" font-weight="800">menaallah-portfolio (Menaallah — The Series)</text>
  <text x="820" y="36" text-anchor="end" class="mono" fill="#C77B9B" font-size="16">↗</text>

  <text x="30" y="68" class="sans" fill="#E5B5C7" font-size="12">
    Cinematic, streaming-inspired personal portfolio website built with React 18, Vite 6, TypeScript, Tailwind CSS v4,
  </text>
